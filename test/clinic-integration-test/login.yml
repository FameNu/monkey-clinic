info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{loginEmail}}",
        "password": "{{loginPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.token) {
          bru.setVar("authToken", res.body.data.token);
        }
    - type: tests
      code: |-
        test("login succeeds", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
        });

        test("login returns a token and the requested user", function() {
          expect(res.body.data.token).to.be.a("string").and.not.empty;
          expect(res.body.data.user.email).to.equal(bru.getEnvVar("loginEmail"));
        });

settings:
  encodeUrl: true
