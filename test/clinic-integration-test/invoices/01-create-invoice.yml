info:
  name: 01-create-invoice
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/invoices"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "appointment_id": "{{appointmentId}}",
        "discount": 5
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.data?.id) {
          bru.setVar("invoiceId", res.body.data.id);
        }
    - type: tests
      code: |-
        test("invoice is created from the consultation and prescription costs", function() {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("success");
          expect(res.body.data.id).to.be.a("string").and.not.empty;
          expect(res.body.data.appointment_id).to.equal(bru.getVar("appointmentId"));
          expect(res.body.data.doctor_fee).to.equal(750);
          expect(res.body.data.medication_total).to.equal(4);
          expect(res.body.data.discount).to.equal(5);
          expect(res.body.data.total_amount).to.equal(749);
          expect(res.body.data.payment_status).to.equal("unpaid");
        });
