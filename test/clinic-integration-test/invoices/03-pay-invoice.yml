info:
  name: 03-pay-invoice
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/invoices/{{invoiceId}}/pay"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "payment_method": "cash"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("invoice is marked paid", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.data.id).to.equal(bru.getVar("invoiceId"));
          expect(res.body.data.payment_status).to.equal("paid");
          expect(res.body.data.payment_method).to.equal("cash");
          expect(res.body.data.paid_at).to.be.a("string").and.not.empty;
        });
