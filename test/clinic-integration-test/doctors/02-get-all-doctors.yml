info:
  name: 02-get-all-doctors
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/doctors"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("doctor list includes the doctor created in this run", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.data).to.be.an("array");
          expect(res.body.data.some((doctor) => doctor.id === bru.getVar("doctorId"))).to.equal(true);
        });
