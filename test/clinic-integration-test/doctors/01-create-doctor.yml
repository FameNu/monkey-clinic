info:
  name: 01-create-doctor
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/doctors"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "create_account": false,
        "prefix": "Dr.",
        "full_name": "Bruno Integration Doctor",
        "specialization": "General Practice",
        "license_number": "BRU-{{$timestamp}}",
        "phone": "08{{$timestamp}}",
        "consultation_fee": 750
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.data?.id) {
          bru.setVar("doctorId", res.body.data.id);
        }
    - type: tests
      code: |-
        test("doctor is created and returned", function() {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("success");
          expect(res.body.data.id).to.be.a("string").and.not.empty;
          expect(res.body.data.license_number).to.include("BRU-");
          expect(res.body.data.is_active).to.equal(true);
        });
