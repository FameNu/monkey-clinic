info:
  name: 03-get-patient-by-id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/patients/{{patientId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("patient details are returned by ID", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.data.id).to.equal(bru.getVar("patientId"));
          expect(res.body.data.full_name).to.include("Bruno Integration Patient");
        });
