info:
  name: 03-update-appointment-status
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/appointments/{{appointmentId}}/status"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "cancelled"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("appointment status is updated", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.message).to.equal("Appointment status updated");
        });
