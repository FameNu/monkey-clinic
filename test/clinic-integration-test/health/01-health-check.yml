info:
  name: 01-health-check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/health"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("health endpoint reports a connected database", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.database).to.equal("connected");
        });
