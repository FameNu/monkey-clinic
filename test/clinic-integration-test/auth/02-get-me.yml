info:
  name: 02-get-me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("get me succeeds with the login token", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
        });

        test("get me returns the authenticated user", function() {
          expect(res.body.data.email).to.equal(bru.getEnvVar("loginEmail"));
          expect(res.body.data.id).to.be.a("string").and.not.empty;
          expect(res.body.data).to.have.property("role");
        });

settings:
  encodeUrl: true
